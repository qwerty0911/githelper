[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-helper"
version = "0.1.0"
description = "Generate beginner-friendly project guides for public GitHub repositories"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "jinja2>=3.1,<4",
    "langgraph>=0.2,<2",
    "langchain-openai>=0.2,<2",
    "langchain>=0.3,<2",
    "langfuse>=3,<4",
    "motor>=3.5,<4",
    "tiktoken>=0.7,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1", "mongomock-motor>=0.0.30"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.agent" = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# Google Python Style Guide: 80-column lines, 4-space indents.
line-length = 80
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: imports, N: naming, D: docstrings,
# UP: modern syntax.
select = ["E", "W", "F", "I", "N", "D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# Google style: one import per line, sorted within each section.
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["typing", "collections.abc"]

[tool.ruff.lint.per-file-ignores]
# Test names describe the behavior, so docstrings are optional there.
"tests/*" = ["D"]
